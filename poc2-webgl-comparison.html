<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 2 Performance Comparison - Side by Side</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            display: flex;
            height: calc(100vh - 100px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #333;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .panel-header.unoptimized {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .panel-header.optimized {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .iframe-container {
            flex: 1;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            background: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        .controls label {
            margin-right: 10px;
            font-size: 14px;
        }

        .controls input[type="range"] {
            width: 200px;
            vertical-align: middle;
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 14px;
        }

        .controls button:hover {
            background: #5568d3;
        }

        .comparison-stats {
            background: #34495e;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #95a5a6;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .stat-value.better {
            color: #27ae60;
        }

        .stat-value.worse {
            color: #e74c3c;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }

            .panel {
                border-right: none;
                border-bottom: 2px solid #333;
            }

            .panel:last-child {
                border-bottom: none;
            }
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">← Back to Dashboard</a>

    <div class="header">
        <h1>WebGL 2 Performance Comparison</h1>
        <p>Side-by-side comparison of unoptimized vs optimized rendering</p>
    </div>

    <div class="controls">
        <label>
            Object Count: <span id="objectCountLabel">1000</span>
            <input type="range" id="objectCount" min="100" max="5000" value="1000" step="100">
        </label>
        <button onclick="syncFrames()">🔄 Sync Views</button>
        <button onclick="resetViews()">↺ Reset</button>
    </div>

    <div class="comparison-stats">
        <div class="stat">
            <div class="stat-label">FPS Difference</div>
            <div class="stat-value better" id="fpsDiff">Calculating...</div>
        </div>
        <div class="stat">
            <div class="stat-label">Draw Call Reduction</div>
            <div class="stat-value better" id="drawCallDiff">Calculating...</div>
        </div>
        <div class="stat">
            <div class="stat-label">Performance Multiplier</div>
            <div class="stat-value better" id="perfMultiplier">Calculating...</div>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-header unoptimized">
                ❌ UNOPTIMIZED
            </div>
            <div class="iframe-container">
                <iframe id="unoptimized" src="poc2-webgl-unoptimized.html"></iframe>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header optimized">
                ✓ OPTIMIZED
            </div>
            <div class="iframe-container">
                <iframe id="optimized" src="poc2-webgl-optimized.html"></iframe>
            </div>
        </div>
    </div>

    <script>
        const objectCountSlider = document.getElementById('objectCount');
        const objectCountLabel = document.getElementById('objectCountLabel');
        const unoptimizedFrame = document.getElementById('unoptimized');
        const optimizedFrame = document.getElementById('optimized');

        // Sync object count across both iframes
        objectCountSlider.addEventListener('input', (e) => {
            const count = e.target.value;
            objectCountLabel.textContent = count;

            // Try to update both iframes
            try {
                if (unoptimizedFrame.contentWindow) {
                    const unoptSlider = unoptimizedFrame.contentDocument.getElementById('objectCount');
                    if (unoptSlider) {
                        unoptSlider.value = count;
                        unoptSlider.dispatchEvent(new Event('input'));
                    }
                }
            } catch (e) {
                console.log('Cannot access unoptimized iframe:', e);
            }

            try {
                if (optimizedFrame.contentWindow) {
                    const optSlider = optimizedFrame.contentDocument.getElementById('objectCount');
                    if (optSlider) {
                        optSlider.value = count;
                        optSlider.dispatchEvent(new Event('input'));
                    }
                }
            } catch (e) {
                console.log('Cannot access optimized iframe:', e);
            }
        });

        function syncFrames() {
            const count = objectCountSlider.value;
            objectCountSlider.dispatchEvent(new Event('input'));
            alert('Views synchronized with ' + count + ' objects');
        }

        function resetViews() {
            objectCountSlider.value = 1000;
            objectCountSlider.dispatchEvent(new Event('input'));
            unoptimizedFrame.src = unoptimizedFrame.src;
            optimizedFrame.src = optimizedFrame.src;
        }

        // Calculate performance differences
        function updateStats() {
            try {
                const unoptFps = parseInt(unoptimizedFrame.contentDocument.getElementById('fps')?.textContent || 0);
                const optFps = parseInt(optimizedFrame.contentDocument.getElementById('fps')?.textContent || 0);

                const unoptDrawCalls = parseInt(unoptimizedFrame.contentDocument.getElementById('drawCalls')?.textContent || 0);
                const optDrawCalls = parseInt(optimizedFrame.contentDocument.getElementById('drawCalls')?.textContent || 0);

                if (unoptFps > 0 && optFps > 0) {
                    const fpsDiff = optFps - unoptFps;
                    const fpsPercent = unoptFps > 0 ? ((fpsDiff / unoptFps) * 100).toFixed(0) : 0;
                    document.getElementById('fpsDiff').textContent =
                        (fpsDiff > 0 ? '+' : '') + fpsDiff + ' FPS (' + (fpsPercent > 0 ? '+' : '') + fpsPercent + '%)';

                    const perfMult = unoptFps > 0 ? (optFps / unoptFps).toFixed(1) : 0;
                    document.getElementById('perfMultiplier').textContent = perfMult + 'x faster';
                }

                if (unoptDrawCalls > 0 && optDrawCalls > 0) {
                    const reduction = ((1 - optDrawCalls / unoptDrawCalls) * 100).toFixed(1);
                    document.getElementById('drawCallDiff').textContent =
                        reduction + '% (' + unoptDrawCalls + ' → ' + optDrawCalls + ')';
                }
            } catch (e) {
                // Ignore cross-origin errors
            }
        }

        // Update stats periodically
        setInterval(updateStats, 1000);

        // Initial stats update after frames load
        window.addEventListener('load', () => {
            setTimeout(updateStats, 2000);
        });
    </script>
</body>
</html>
